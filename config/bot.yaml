# rk-bot config — hot-reloaded on save
# Skill / item IDs confirmed for RayRag from live capture 2026-08-15.

enabled: true
tick_ms: 500

# Skill assignment — first matching rule wins.
# match values are case-insensitive substrings of the mob name.
skills:
  - match: [hode]
    skill: { id: 11, level: 10 }        # Fire Bolt lv 10
  - match: [steel chonchon, chonchon]
    skill: { id: 11, level: 10 }        # Fire Bolt lv 10
  - match: [deniro]
    skill: { id: 11, level: 6 }         # Fire Bolt lv 6
  - match: [piere]
    skill: { id: 11, level: 6 }         # Fire Bolt lv 6

# Per-mob targeting policy.
# default   = what to do for mobs not listed
# auto      = attack when found
# skip      = never attack
mon_control:
  default: skip
  Hode: auto
  Steel Chonchon: auto
  Deniro: auto
  Piere: auto

# Movement toward target
combat:
  cast_range_cells: 9
  approach_stop_short: 2
  move_debounce_ms: 400
  cast_debounce_ms: 2500

# Emergency escape via Fly Wing
emergency:
  fly_wing_item_id: 601                 # confirmed from user's manual use
  hp_pct_threshold: 30                  # HP < 30% → wing
  wing_on_hit: true                     # any hit taken → wing
  wing_cooldown_ms: 4000                # min delay between wings

# Loot
loot:
  default: pickup                       # pickup | skip
  range_cells: 12
  max_age_ms: 30000

# Roam when no target visible
roam:
  enabled: false                        # user warps here directly; no waypoints
  idle_ms: 4000
  radius_tiles: 15
